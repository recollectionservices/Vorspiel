<h1>Der Zeitgeist (1799)</h1>
<h2 class="volume">Friedrich Hölderlin</h2>
<hr>
<p> <i>
... eine Stelle finden <br>
... den Geist <br>
Heiternd ein Gött; <br> 
Wenn du, Ershutter! ihn ergreifest. </i>
</p>
<p>
... Find in the Placement <br>
... A Spirit <br>
... Illuminating, the God meets Mortals; <br>
... When Convulsing! Possess it. 
</p>
